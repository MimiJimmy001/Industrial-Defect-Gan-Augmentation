name: syntax-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff>=0.8,<1"
      - run: ruff check --select E9,F63,F7,F82 .
      - run: python -m compileall -q .